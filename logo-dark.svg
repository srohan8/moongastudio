<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 212 50" width="212" height="50" role="img" aria-label="Moonga — Building products that matters">
  <!-- Icon badge -->
  <rect x="0" y="1" width="46" height="46" rx="9" fill="#E8DCC4"/>

  <!-- Owl body -->
  <ellipse cx="23" cy="30" rx="12.5" ry="15" fill="#2A1E12"/>

  <!-- Ear tufts -->
  <polygon points="15,17 18,9 21,17" fill="#2A1E12"/>
  <polygon points="25,17 28,9 31,17" fill="#2A1E12"/>

  <!-- Eyes — gold irises -->
  <circle cx="18.5" cy="27" r="5" fill="#C8A030"/>
  <circle cx="27.5" cy="27" r="5" fill="#C8A030"/>

  <!-- Pupils -->
  <circle cx="18.5" cy="27" r="2.6" fill="#1A1610"/>
  <circle cx="27.5" cy="27" r="2.6" fill="#1A1610"/>

  <!-- Eye shine -->
  <circle cx="19.8" cy="25.5" r="1.1" fill="#F5E080" opacity="0.85"/>
  <circle cx="28.8" cy="25.5" r="1.1" fill="#F5E080" opacity="0.85"/>

  <!-- Beak -->
  <polygon points="21.5,31 23,34 24.5,31" fill="#C8A030" opacity="0.75"/>

  <!-- MOONGA wordmark -->
  <text x="58" y="24"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-weight="700"
        font-size="18"
        letter-spacing="4"
        fill="#F0E8D8">MOONGA</text>

  <!-- Tagline -->
  <text x="59" y="39"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-weight="300"
        font-size="8.5"
        letter-spacing="0.6"
        fill="#8A7E6E">Building products that matters</text>
</svg>
