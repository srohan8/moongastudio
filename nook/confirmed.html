<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Email confirmed — Nook</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Lato:wght@300;400&display=swap" rel="stylesheet" />
  <style>
    *,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --bg:#F0EBE0; --ink:#3A3228; --ink-soft:#66594B; --terra:#C65A3A; }
    html,body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: 'Lato', system-ui, sans-serif;
      min-height: 100%;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center;
      padding: 2rem 1.5rem;
      -webkit-font-smoothing: antialiased;
    }
    .wordmark { width: min(54vw, 190px); height: auto; margin-bottom: 2.25rem; }
    .check {
      width: 56px; height: 56px; border-radius: 50%;
      background: var(--terra); color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.7rem; margin: 0 auto 1.25rem;
      box-shadow: 0 4px 18px rgba(198,90,58,.28);
    }
    h1 {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-weight: 300; font-size: clamp(2rem, 7vw, 2.8rem);
      line-height: 1.1; margin-bottom: .75rem;
    }
    p {
      font-weight: 300; color: var(--ink-soft);
      font-size: 1rem; line-height: 1.6;
      max-width: 360px; margin: 0 auto;
    }
    .cta {
      display: inline-flex; align-items: center; gap: .5rem;
      margin-top: 2rem;
      background: var(--ink); color: var(--bg);
      font-size: .8rem; letter-spacing: .06em; text-transform: uppercase;
      text-decoration: none; padding: 13px 28px; border-radius: 40px;
      transition: opacity .18s;
    }
    .cta:hover { opacity: .82; }
    .note { margin-top: 1.25rem; font-size: .8rem; color: var(--ink-soft); opacity: .8; }
    footer {
      position: fixed; bottom: 0; left: 0; right: 0;
      padding: 1.25rem; font-size: .72rem; color: var(--ink-soft); opacity: .55;
    }
    footer a { color: inherit; text-decoration: none; }
    footer a:hover { color: var(--ink); }
  </style>
</head>
<body>
  <img class="wordmark" src="nook-wordmark.svg" alt="Nook" />
  <div class="check">✓</div>
  <h1>You're all set.</h1>
  <p>Your email is confirmed. Open the Nook app and sign in to find your spot.</p>
  <a class="cta" href="https://play.google.com/store/apps/details?id=studio.moonga.flow">Open Nook on Android</a>
  <p class="note">Already have the app? Just switch back to it and sign in.</p>
  <footer>
    <a href="privacy.html">Privacy</a> &nbsp;·&nbsp; <a href="terms.html">Terms</a> &nbsp;·&nbsp; © 2026 Moonga Studio
  </footer>
</body>
</html>
